[project]
name = "flightstack"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "mavsdk<4", "matplotlib", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flight*", "sim*", "configs*", "analysis*"]